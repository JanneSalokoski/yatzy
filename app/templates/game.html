{% extends "base.html" %}

{% block extra_css %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/game.css') }}" />
{% endblock %}

{% block content %}
<section>
    <h2>Peli</h2>
    <div class="game">
        <div class="grid">
        </div>
        <div class="throw">
            <div class="dice">
            <div class="die" id="die-1"></div>
            <div class="die" id="die-2"></div>
            <div class="die" id="die-3"></div>
            <div class="die" id="die-4"></div>
            <div class="die" id="die-5"></div>
            </div>
            <input name="throw" id="throw" type="button" value="heitä" />
        </div>
        <div class="stats">
            <ul>
                <li class="sum"><span class="label">Summa</span>: <span class="value"></span></li>
                <li class="locked-sum"><span class="label">Lukittujen summa</span>: <span class="value"></span></li>
                <li class="max-sum"><span class="label">Maksimisumma</span>: <span class="value"></span></li>
            </ul>
        </div>
    </div>
</section>
<script>
    console.log("Inline JS works");
</script>
{% endblock %}

{% block extra_js %}
    {{ super() }}
    <script src="{{ url_for('static', filename='scripts/game.js') }}"></script>
{% endblock %}
